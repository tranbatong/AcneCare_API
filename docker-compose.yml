services:
  mysql-db:
    image: mysql:8.0.45-debian
    container_name: acnecare-mysql
    environment:
      MYSQL_DATABASE: ${DATASOURCE_DB:-acnecare}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_USER: ${DATABASE_USERNAME}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acnecare-network
    restart: always
    volumes:
      - ./mysql-data:/var/lib/mysql
    

  # --- Service App: AcneCare API ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acnecare-app
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - SPRING_DATASOURCE_URL=${DATABASE_URL}
      - DATASOURCE_USERNAME=${DATABASE_USERNAME}
      - DATASOURCE_PASSWORD=${DATABASE_PASSWORD}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - ACCESS_TOKEN_VALID_DURATION=${ACCESS_TOKEN_VALID_DURATION}
      - REFRESH_TOKEN_VALID_DURATION=${REFRESH_TOKEN_VALID_DURATION}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_SAME_SITE=${AUTH_COOKIE_SAME_SITE:-Lax}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - acnecare-network

networks:
  acnecare-network:
    driver: bridge
volumes:
  mysql-data:
    driver: local

